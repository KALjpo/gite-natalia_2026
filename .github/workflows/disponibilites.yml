name: Synchroniser les disponibilités

# Recopie les périodes occupées de l'agenda Google du gîte dans
# assets/data/disponibilites.json. L'adresse de l'agenda est lue dans le
# secret AGENDA_ICAL_URL (Settings → Secrets and variables → Actions).

on:
  schedule:
    - cron: '17 * * * *' # toutes les heures
  workflow_dispatch: # bouton « Run workflow » pour une mise à jour immédiate

permissions:
  contents: write

concurrency:
  group: disponibilites
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lire l'agenda
        env:
          AGENDA_ICAL_URL: ${{ secrets.AGENDA_ICAL_URL }}
        run: node scripts/sync-disponibilites.mjs

      - name: Enregistrer si les disponibilités ont changé
        run: |
          if git diff --quiet -- assets/data/disponibilites.json; then
            echo "Aucun changement."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/disponibilites.json
          git commit -m "Mise à jour des disponibilités"
          git push
